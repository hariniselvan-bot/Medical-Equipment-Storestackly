<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | STACKLY</title>
<meta name="description" content="This page needs medical attention.">
<link rel="icon" type="image/svg+xml" href="svg/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<main style="min-height:100svh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--soft),#fff);position:relative;overflow:hidden;padding:40px 20px">
  <div style="position:absolute;top:-200px;right:-160px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(25,184,209,.18),transparent 65%)"></div>
  <div style="position:relative;text-align:center;max-width:640px">
    <div class="pulse-bars" style="justify-content:center;margin:0 auto 10px"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h1 style="font-size:clamp(90px,18vw,170px);line-height:1;letter-spacing:-.04em"><span class="grad-text">404</span></h1>
    <h2 style="font-size:clamp(22px,3.4vw,30px);margin-top:10px">Oops! This page needs medical attention.</h2>
    <p style="color:var(--slate);margin:16px auto 34px;max-width:46ch">The page you are looking for was moved, never existed, or is currently in recovery. Our team has been notified of the flatline.</p>
    <div class="hero-actions" style="justify-content:center">
      <button class="btn btn-ghost" id="go-back" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>Go Back</button>
      <a href="index.html" class="btn btn-primary">Back to Home <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
    </div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  if (window.history.scrollRestoration) window.history.scrollRestoration = 'auto';
  document.getElementById('go-back').addEventListener('click', function () {
    var saved = sessionStorage.getItem('stackly_404_return');
    if (saved) {
      var returnState = JSON.parse(saved);
      if (returnState.href) {
        window.location.replace(returnState.href);
        return;
      }
    }
    if (window.history.length > 1) {
      window.history.back();
    } else if (document.referrer) {
      window.location.replace(document.referrer);
    }
  });
  if (window.gsap) {
    gsap.fromTo('main > div:last-child', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1, ease: 'power3.out' });
  }
</script>
<script src="js/components.js"></script>
</body>
</html>
